<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1A1A1E">
  <title>Eatsa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden}
    body{background:#1A1A1E;font-family:-apple-system,'SF Pro Display','Inter','Segoe UI',sans-serif}
    #root{height:100%}
    ::-webkit-scrollbar{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
    input,textarea,button{font-family:inherit}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
var useState=React.useState,useRef=React.useRef,useEffect=React.useEffect;

/* ═══ PROXY — toutes les requêtes Claude passent par la fonction Netlify ═══ */
var API_URL="/.netlify/functions/chat";

var C={bg:"#1A1A1E",bgCard:"#242428",bgEl:"#2E2E34",bgIn:"#1E1E22",
  tx:"#FAFAF5",txS:"#A8A8B0",txM:"#6B6B74",
  pr:"#37B97D",prS:"#37B97D22",prG:"#37B97D44",
  prot:"#7C6FF7",carb:"#FFB443",fat:"#FF6B6B",cal:"#37B97D",
  ok:"#37B97D",okBg:"#37B97D1A",adj:"#FFB443",adjBg:"#FFB4431A",bad:"#FF6B6B",badBg:"#FF6B6B1A",
  brd:"#2E2E34",div:"#333338",r:20,rs:14,rx:10};
var F="-apple-system,'SF Pro Display','Inter','Segoe UI',sans-serif";
var NAV_H=72;
var TOP_SAFE=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sat")||"0")||0;

var prof={name:"Samuel",calG:1900,protG:140,carbG:200,fatG:55,obj:"Prise de muscle + déficit calorique",act:"Modéré"};
var initJ=[
  {id:1,name:"Skyr nature 0%",time:"08:30",p:10,cal:60,cb:4,f:0,v:"ideal",em:"🥛"},
  {id:2,name:"Poulet grillé + riz",time:"12:45",p:38,cal:480,cb:55,f:8,v:"ideal",em:"🍗"},
  {id:3,name:"Barre protéinée Gerblé",time:"16:00",p:12,cal:200,cb:22,f:7,v:"adjust",em:"🍫"},
];
var favs=[{n:"Skyr 0%",p:10,cal:60,em:"🥛"},{n:"Œufs x2",p:12,cal:140,em:"🥚"},{n:"Poulet 150g",p:35,cal:165,em:"🍗"},{n:"Fromage blanc",p:8,cal:48,em:"🧈"},{n:"Thon naturel",p:26,cal:110,em:"🐟"}];

var vc=function(v){return v==="ideal"?C.ok:v==="adjust"?C.adj:C.bad};
var vb=function(v){return v==="ideal"?C.okBg:v==="adjust"?C.adjBg:C.badBg};
var vl=function(v){return v==="ideal"?"Idéal":v==="adjust"?"À ajuster":"À éviter"};
var vi=function(v){return v==="ideal"?"✓":v==="adjust"?"!":"✕"};
var tot=function(j){return j.reduce(function(a,e){return{p:a.p+e.p,c:a.c+e.cal,cb:a.cb+e.cb,f:a.f+e.f}},{p:0,c:0,cb:0,f:0})};

function CG({value,max,color,label,unit,size,sw,hero}){
  size=size||140;sw=sw||10;var pct=Math.min(value/max,1),r=(size-sw*2)/2,ci=2*Math.PI*r,off=ci*(1-pct),rem=Math.max(max-value,0);
  return <div style={{textAlign:"center",position:"relative"}}>
    <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.bgEl} strokeWidth={sw}/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={sw} strokeDasharray={ci} strokeDashoffset={off} strokeLinecap="round" style={{transition:"stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)",filter:"drop-shadow(0 0 6px "+color+"66)"}}/></svg>
    <div style={{position:"absolute",top:0,left:0,right:0,bottom:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><span style={{fontFamily:F,fontSize:hero?32:22,fontWeight:700,color:C.tx,lineHeight:1}}>{value}</span><span style={{fontFamily:F,fontSize:hero?12:10,color:C.txM,marginTop:2}}>{hero?"/ "+max+" "+unit:unit}</span></div>
    <p style={{fontFamily:F,fontSize:11,fontWeight:600,color:C.txS,margin:"6px 0 0",textTransform:"uppercase",letterSpacing:.8}}>{label}</p>
    {hero&&<p style={{fontFamily:F,fontSize:12,fontWeight:600,color:color,margin:"2px 0 0"}}>{rem>0?rem+" "+unit+" restants":"Objectif atteint ✓"}</p>}
  </div>;
}
function Cd({children,style,onClick}){return <div onClick={onClick} style={{background:C.bgCard,borderRadius:C.r,padding:16,border:"1px solid "+C.brd,cursor:onClick?"pointer":"default",...style}}>{children}</div>}
function VB({v,s}){return <span style={{display:"inline-flex",alignItems:"center",gap:s?4:6,background:vb(v),color:vc(v),borderRadius:20,padding:s?"2px 8px":"4px 11px",fontSize:s?9:10,fontWeight:700,fontFamily:F,letterSpacing:.4,textTransform:"uppercase"}}><span style={{fontSize:s?8:11}}>{vi(v)}</span>{vl(v)}</span>}
function MB({value,max,color}){return <div style={{height:4,borderRadius:2,background:C.bgEl,overflow:"hidden"}}><div style={{height:4,borderRadius:2,background:color,width:Math.min((value/max)*100,100)+"%",transition:"width .8s ease-out"}}/></div>}

/* ═══ DASHBOARD ═══ */
function Dash({journal,isExp,onTog,onNav}){
  var t=tot(journal),remP=prof.protG-t.p;
  var tip=remP>40?remP+"g de protéines restantes. Vise poulet, poisson ou œufs au prochain repas.":remP>0?"Plus que "+remP+"g de protéines. Un yaourt grec suffit.":"Protéines OK ! Gère les "+(prof.calG-t.c)+" kcal restantes avec un repas léger.";
  return <div style={{padding:"env(safe-area-inset-top, 12px) 16px "+(NAV_H+16)+"px",overflowY:"auto",height:"100%"}}>
    <div style={{paddingTop:12,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
      <div><h1 style={{fontFamily:F,fontSize:24,fontWeight:700,color:C.tx}}>Bonjour {prof.name}</h1><p style={{fontFamily:F,fontSize:12,color:C.txM,marginTop:3}}>{new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p></div>
      <div onClick={function(){onNav("profile")}} style={{width:38,height:38,borderRadius:19,background:C.bgEl,border:"1px solid "+C.brd,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:16}}>👤</div>
    </div>
    {/* Mode switch */}
    <div onClick={onTog} style={{background:C.bgEl,borderRadius:28,padding:3,cursor:"pointer",display:"flex",height:48,position:"relative",border:"1px solid "+C.brd,userSelect:"none",marginBottom:4}}>
      <div style={{position:"absolute",top:3,width:"calc(50% - 3px)",height:42,background:C.pr,borderRadius:24,boxShadow:"0 0 16px "+C.prG,left:isExp?3:"50%",transition:"left .3s cubic-bezier(.4,0,.2,1)"}}/>
      {[{ic:"⚡",lb:"Express",a:isExp},{ic:"🍳",lb:"Cuisine",a:!isExp}].map(function(m,i){return <div key={i} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,zIndex:1,color:m.a?"#fff":C.txM}}><span style={{fontSize:14}}>{m.ic}</span><span style={{fontFamily:F,fontSize:13,fontWeight:600}}>{m.lb}</span></div>})}
    </div>
    {/* Gauges */}
    <div style={{display:"flex",justifyContent:"center",margin:"24px 0 4px"}}><CG value={t.c} max={prof.calG} color={C.cal} label="Calories" unit="kcal" size={160} sw={12} hero/></div>
    <div style={{display:"flex",justifyContent:"space-around",margin:"4px 0 20px"}}><CG value={t.p} max={prof.protG} color={C.prot} label="Protéines" unit="g" size={80} sw={6}/><CG value={t.cb} max={prof.carbG} color={C.carb} label="Glucides" unit="g" size={80} sw={6}/><CG value={t.f} max={prof.fatG} color={C.fat} label="Lipides" unit="g" size={80} sw={6}/></div>
    {/* Scan */}
    <div style={{display:"flex",justifyContent:"center",margin:"16px 0 4px"}}><div onClick={function(){onNav("scan")}} style={{width:76,height:76,borderRadius:38,background:"linear-gradient(135deg,"+C.pr+",#2DD48A)",boxShadow:"0 8px 24px "+C.prG,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:26}}>📸</div></div>
    <p style={{textAlign:"center",fontFamily:F,fontSize:13,fontWeight:600,color:C.tx}}>Scan Flash</p>
    <p style={{textAlign:"center",fontFamily:F,fontSize:11,color:C.txM,margin:"2px 0 16px"}}>Scanner · Rechercher · Comparer</p>
    {/* Coach */}
    <Cd style={{background:C.prS,border:"1px solid "+C.pr+"30",marginBottom:16}}><div style={{display:"flex",gap:12}}><span style={{fontSize:20,marginTop:1}}>🧠</span><div><p style={{fontFamily:F,fontSize:10,fontWeight:700,color:C.pr,textTransform:"uppercase",letterSpacing:.6,marginBottom:5}}>Coach</p><p style={{fontFamily:F,fontSize:13,color:C.tx,lineHeight:1.55}}>{tip}</p></div></div></Cd>
    {/* Quick add */}
    <p style={{fontFamily:F,fontSize:10,fontWeight:700,color:C.txM,textTransform:"uppercase",letterSpacing:.8,marginBottom:8}}>Ajouter en 1 tap</p>
    <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:6}}>{favs.map(function(f,i){return <div key={i} style={{minWidth:110,background:C.bgEl,borderRadius:C.rs,padding:"10px 12px",border:"1px solid "+C.brd,cursor:"pointer",flexShrink:0}}><span style={{fontSize:20}}>{f.em}</span><p style={{fontFamily:F,fontSize:11,fontWeight:600,color:C.tx,margin:"4px 0 2px",whiteSpace:"nowrap"}}>{f.n}</p><p style={{fontFamily:F,fontSize:10,color:C.txM}}>{f.p}g prot · {f.cal} kcal</p></div>})}</div>
    {/* Jow */}
    <Cd onClick={function(){onNav("jow")}} style={{marginTop:14,display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}><span style={{fontSize:20}}>✨</span><div style={{flex:1}}><p style={{fontFamily:F,fontSize:13,fontWeight:600,color:C.tx}}>Hacks Jow</p><p style={{fontFamily:F,fontSize:11,color:C.txM,marginTop:2}}>Optimise une recette Jow</p></div><span style={{color:C.txM}}>›</span></Cd>
  </div>;
}

/* ═══ SCAN ═══ */
function Scan({onBack,onAdd}){
  var _b=useState(""),bc=_b[0],sBc=_b[1],_q=useState(""),q=_q[0],sQ=_q[1],_l=useState(false),ld=_l[0],sLd=_l[1],_p=useState(null),prod=_p[0],sProd=_p[1],_r=useState(null),res=_r[0],sRes=_r[1],_e=useState(null),er=_e[0],sEr=_e[1];
  var lookup=function(code){if(!code||!code.trim())return;sLd(true);sProd(null);sEr(null);sRes(null);
    fetch("https://world.openfoodfacts.org/api/v2/product/"+code.trim()+".json?fields=product_name,brands,nutriments,nutriscore_grade").then(function(r){return r.json()}).then(function(d){
      if(d.status===1&&d.product){var p=d.product,n=p.nutriments||{},pr=Math.round(n.proteins_100g||0),ca=Math.round(n["energy-kcal_100g"]||0),rt=ca>0?parseFloat(((pr/ca)*100).toFixed(1)):0;
        sProd({name:p.product_name||"Produit",brand:p.brands||"",prot:pr,cal:ca,ratio:rt,fat:Math.round(n.fat_100g||0),carbs:Math.round(n.carbohydrates_100g||0),sugars:Math.round(n.sugars_100g||0),fiber:Math.round(n.fiber_100g||0),score:p.nutriscore_grade||"?",v:rt>=8?"ideal":rt>=4?"adjust":"notOptimal"});
      }else sEr("Produit non trouvé.");sLd(false);
    }).catch(function(){sEr("Erreur réseau.");sLd(false);});};
  var search=function(qq){if(!qq||!qq.trim())return;sLd(true);sProd(null);sEr(null);sRes(null);
    fetch("https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(qq.trim())+"&search_simple=1&action=process&json=1&page_size=8&fields=code,product_name,brands,nutriments,nutriscore_grade").then(function(r){return r.json()}).then(function(d){
      if(d.products&&d.products.length>0){sRes(d.products.map(function(p){var n=p.nutriments||{},pr=Math.round(n.proteins_100g||0),ca=Math.round(n["energy-kcal_100g"]||0),rt=ca>0?parseFloat(((pr/ca)*100).toFixed(1)):0;return{code:p.code,name:p.product_name||"?",brand:p.brands||"",prot:pr,cal:ca,ratio:rt,score:p.nutriscore_grade||"?",v:rt>=8?"ideal":rt>=4?"adjust":"notOptimal"}}));}else sEr("Aucun résultat.");sLd(false);
    }).catch(function(){sEr("Erreur réseau.");sLd(false);});};

  return <div style={{padding:"env(safe-area-inset-top, 12px) 16px "+(NAV_H+16)+"px",overflowY:"auto",height:"100%"}}>
    <div style={{paddingTop:12,display:"flex",alignItems:"center",gap:12,marginBottom:20}}><div onClick={onBack} style={{cursor:"pointer",fontSize:18,color:C.txS}}>←</div><h2 style={{fontFamily:F,fontSize:20,fontWeight:700,color:C.tx}}>Scanner · Rechercher</h2></div>
    <Cd style={{marginBottom:10,padding:14}}><p style={{fontFamily:F,fontSize:10,fontWeight:700,color:C.txM,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Code-barres</p><div style={{display:"flex",gap:8}}><input value={bc} onChange={function(e){sBc(e.target.value)}} onKeyDown={function(e){if(e.key==="Enter")lookup(bc)}} placeholder="3033490004750" style={{flex:1,padding:11,borderRadius:C.rx,border:"1px solid "+C.brd,fontFamily:F,fontSize:14,outline:"none",background:C.bgIn,color:C.tx}}/><button onClick={function(){lookup(bc)}} style={{background:C.pr,color:"#fff",border:"none",borderRadius:C.rx,padding:"0 16px",fontWeight:600,cursor:"pointer",fontSize:15}}>📷</button></div></Cd>
    <Cd style={{marginBottom:14,padding:14}}><p style={{fontFamily:F,fontSize:10,fontWeight:700,color:C.txM,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Recherche par nom</p><div style={{display:"flex",gap:8}}><input value={q} onChange={function(e){sQ(e.target.value)}} onKeyDown={function(e){if(e.key==="Enter")search(q)}} placeholder="skyr, thon, poulet..." style={{flex:1,padding:11,borderRadius:C.rx,border:"1px solid "+C.brd,fontFamily:F,fontSize:14,outline:"none",background:C.bgIn,color:C.tx}}/><button onClick={function(){search(q)}} style={{background:C.pr,color:"#fff",border:"none",borderRadius:C.rx,padding:"0 16px",fontWeight:600,cursor:"pointer"}}>🔍</button></div></Cd>
    {ld&&<div style={{textAlign:"center",padding:32}}><div style={{width:28,height:28,border:"3px solid "+C.bgEl,borderTopColor:C.pr,borderRadius:14,margin:"0 auto 10px",animation:"spin .7s linear infinite"}}/><p style={{fontFamily:F,fontSize:13,color:C.txM}}>Analyse…</p></div>}
    {er&&<Cd style={{background:C.adjBg,border:"1px solid "+C.adj+"30",marginBottom:12}}><p style={{fontFamily:F,fontSize:13,color:C.tx}}>{er}</p></Cd>}
    {prod&&<Cd style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><VB v={prod.v}/><span style={{fontFamily:F,fontSize:10,fontWeight:700,color:C.txM,background:C.bgEl,padding:"3px 8px",borderRadius:8}}>{prod.score.toUpperCase()}</span></div>
      <h3 style={{fontFamily:F,fontSize:17,fontWeight:700,color:C.tx,marginBottom:2}}>{prod.name}</h3>
      {prod.brand&&<p style={{fontFamily:F,fontSize:12,color:C.txM,marginBottom:14}}>{prod.brand}</p>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:12}}>{[{l:"Protéines",v:prod.prot+"g",c:C.prot},{l:"Calories",v:""+prod.cal,c:C.cal},{l:"Ratio P/C",v:""+prod.ratio,c:prod.ratio>=8?C.ok:prod.ratio>=4?C.adj:C.bad}].map(function(m,i){return <div key={i} style={{textAlign:"center",padding:10,background:C.bgEl,borderRadius:C.rx}}><div style={{fontFamily:F,fontSize:18,fontWeight:700,color:m.c}}>{m.v}</div><div style={{fontFamily:F,fontSize:9,fontWeight:600,color:C.txM,textTransform:"uppercase",marginTop:2}}>{m.l}</div></div>})}</div>
      <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:12}}>{[{l:"Lipides",v:prod.fat},{l:"Glucides",v:prod.carbs},{l:"Sucres",v:prod.sugars},{l:"Fibres",v:prod.fiber}].map(function(d,i){return <span key={i} style={{fontFamily:F,fontSize:12,color:C.txM}}><span style={{fontWeight:600,color:C.txS}}>{d.v}g</span> {d.l}</span>})}</div>
      <p style={{fontFamily:F,fontSize:10,color:C.txM,fontStyle:"italic",marginBottom:12}}>Pour 100g · OpenFoodFacts</p>
      <button onClick={function(){onAdd({name:prod.name,p:prod.prot,cal:prod.cal,cb:prod.carbs,f:prod.fat,v:prod.v,em:"🍽️"})}} style={{width:"100%",padding:13,background:"linear-gradient(135deg,"+C.pr+",#2DD48A)",color:"#fff",border:"none",borderRadius:C.rs,fontFamily:F,fontSize:14,fontWeight:600,cursor:"pointer"}}>+ Ajouter au journal</button>
    </Cd>}
    {res&&res.length>0&&<div><p style={{fontFamily:F,fontSize:10,fontWeight:700,color:C.txM,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>{res.length} résultats</p>
      {res.map(function(p,i){return <Cd key={i} onClick={function(){lookup(p.code)}} style={{marginBottom:8,padding:12,cursor:"pointer"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{flex:1}}><div style={{marginBottom:4}}><VB v={p.v} s/></div><p style={{fontFamily:F,fontSize:13,fontWeight:600,color:C.tx,marginBottom:2}}>{p.name}</p><p style={{fontFamily:F,fontSize:11,color:C.txM}}>{p.brand} · {p.prot}g prot · {p.cal} kcal</p></div><div style={{textAlign:"right"}}><div style={{fontFamily:F,fontSize:17,fontWeight:700,color:p.ratio>=8?C.ok:p.ratio>=4?C.adj:C.bad}}>{p.ratio}</div><div style={{fontFamily:F,fontSize:9,color:C.txM}}>g/100kcal</div></div></div></Cd>})}
    </div>}
    {!prod&&!res&&!ld&&!er&&<div style={{textAlign:"center",padding:"36px 16px"}}><span style={{fontSize:40}}>🥗</span><p style={{fontFamily:F,fontSize:14,fontWeight:600,color:C.tx,marginTop:12}}>Recherche un produit</p><p style={{fontFamily:F,fontSize:12,color:C.txM,lineHeight:1.5}}>Ratio P/C : au-dessus de 8 = idéal<br/>4–8 = correct · en dessous = à éviter</p></div>}
  </div>;
}

/* ═══ COACH ═══ */
function Coach({journal}){
  var _m=useState([{role:"assistant",text:"Salut "+prof.name+" ! Je suis ton coach nutrition. Pose-moi n'importe quelle question — je connais tes objectifs et ce que tu as mangé aujourd'hui. 💪"}]),msgs=_m[0],sM=_m[1];
  var _i=useState(""),inp=_i[0],sI=_i[1];
  var _l=useState(false),ld=_l[0],sL=_l[1];
  var chatRef=useRef(null),inpRef=useRef(null);
  useEffect(function(){if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight},[msgs,ld]);

  var t=tot(journal);
  var jTxt=journal.map(function(e){return e.time+" — "+e.name+" ("+e.p+"g prot, "+e.cal+" kcal, "+e.cb+"g gluc, "+e.f+"g lip)"}).join("\n");
  var sys="Tu es le coach nutrition intégré dans l'app Eatsa. Tu parles en français, de manière directe, concise et bienveillante. Tu tutoies l'utilisateur.\n\nPROFIL :\n- Nom : "+prof.name+"\n- Objectif : "+prof.obj+"\n- Activité : "+prof.act+"\n- Objectifs/jour : "+prof.protG+"g prot, "+prof.calG+" kcal, "+prof.carbG+"g gluc, "+prof.fatG+"g lip\n\nMANGÉ AUJOURD'HUI :\n"+(jTxt||"Rien encore.")+"\n\nTOTAUX : "+t.p+"g prot (obj "+prof.protG+"g), "+t.c+" kcal (obj "+prof.calG+"), "+t.cb+"g gluc, "+t.f+"g lip\nRESTE : "+(prof.protG-t.p)+"g prot, "+(prof.calG-t.c)+" kcal\n\nRÈGLES :\n- 2-4 phrases max sauf demande de détail\n- Personnalise avec le contexte du jour\n- Pour un aliment : verdict (idéal/à ajuster/à éviter) basé sur ratio prot/cal + reste de la journée\n- Ne parle JAMAIS de prix/budget\n- Motivant sans être niais";

  var send=function(text){
    if(!text||!text.trim()||ld)return;
    var uMsg={role:"user",text:text.trim()};
    var newM=msgs.concat([uMsg]);sM(newM);sI("");sL(true);
    var apiM=[];for(var i=0;i<newM.length;i++){if(i===0&&newM[i].role==="assistant")continue;apiM.push({role:newM[i].role==="assistant"?"assistant":"user",content:newM[i].text});}

    fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:500,system:sys,messages:apiM})})
      .then(function(r){return r.json()}).then(function(data){
        var reply="";if(data.content){for(var i=0;i<data.content.length;i++){if(data.content[i].type==="text")reply+=data.content[i].text;}}
        if(!reply)reply="Je n'ai pas pu répondre. Réessaie !";
        sM(function(prev){return prev.concat([{role:"assistant",text:reply}])});sL(false);
